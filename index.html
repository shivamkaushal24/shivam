<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Usage Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 36px 40px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.5rem;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      color: #111827;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }

    input[type="number"]:focus {
      border-color: #6366f1;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }

    button:hover { background: #4f46e5; }

    .result {
      margin-top: 28px;
      display: none;
    }

    .result.visible { display: block; }

    .percentage-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #374151;
      margin-bottom: 8px;
    }

    .bar-track {
      background: #e5e7eb;
      border-radius: 999px;
      height: 18px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.6s ease, background 0.4s ease;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat-box {
      flex: 1;
      min-width: 110px;
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 16px;
      text-align: center;
    }

    .stat-box .value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a1a2e;
    }

    .stat-box .key {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 2px;
    }

    .warning {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .warning.low    { background: #dcfce7; color: #166534; }
    .warning.medium { background: #fef9c3; color: #92400e; }
    .warning.high   { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔢 Token Usage Checker</h1>
    <p class="subtitle">Enter your token counts to see how much of your quota you've used.</p>

    <label for="used">Tokens Used</label>
    <input type="number" id="used" placeholder="e.g. 75000" min="0" />

    <label for="total">Total Token Limit</label>
    <input type="number" id="total" placeholder="e.g. 100000" min="1" />

    <button onclick="calculate()">Check Usage</button>

    <div class="result" id="result">
      <div class="percentage-label">
        <span>Usage</span>
        <span id="pct-text">0%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="bar"></div>
      </div>
      <div class="stats">
        <div class="stat-box">
          <div class="value" id="stat-used">-</div>
          <div class="key">Tokens Used</div>
        </div>
        <div class="stat-box">
          <div class="value" id="stat-remaining">-</div>
          <div class="key">Tokens Remaining</div>
        </div>
        <div class="stat-box">
          <div class="value" id="stat-total">-</div>
          <div class="key">Total Limit</div>
        </div>
      </div>
      <div class="warning" id="warning-msg"></div>
    </div>
  </div>

  <script>
    function calculate() {
      const used  = parseFloat(document.getElementById('used').value);
      const total = parseFloat(document.getElementById('total').value);
      const result = document.getElementById('result');

      if (isNaN(used) || isNaN(total) || total <= 0 || used < 0) {
        alert('Please enter valid positive numbers for both fields.');
        return;
      }

      const pct = Math.min((used / total) * 100, 100);
      const remaining = Math.max(total - used, 0);

      // Update percentage text and bar
      document.getElementById('pct-text').textContent = pct.toFixed(1) + '%';
      const bar = document.getElementById('bar');
      bar.style.width = pct + '%';
      bar.style.background = pct < 50 ? '#22c55e' : pct < 80 ? '#f59e0b' : '#ef4444';

      // Update stat boxes
      document.getElementById('stat-used').textContent      = used.toLocaleString();
      document.getElementById('stat-remaining').textContent = remaining.toLocaleString();
      document.getElementById('stat-total').textContent     = total.toLocaleString();

      // Warning message
      const warn = document.getElementById('warning-msg');
      if (pct < 50) {
        warn.className = 'warning low';
        warn.textContent = '✅ You are using ' + pct.toFixed(1) + '% of your token quota. Plenty remaining!';
      } else if (pct < 80) {
        warn.className = 'warning medium';
        warn.textContent = '⚠️ You have used ' + pct.toFixed(1) + '% of your token quota. Consider monitoring usage.';
      } else {
        warn.className = 'warning high';
        warn.textContent = '🚨 You have used ' + pct.toFixed(1) + '% of your token quota. Running low!';
      }

      result.classList.add('visible');
    }

    // Allow pressing Enter to trigger calculation
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') calculate();
    });
  </script>
</body>
</html>
